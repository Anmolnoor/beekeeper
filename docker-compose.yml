services:
  postgres:
    image: postgres:18
    container_name: beekeeper-postgres
    environment:
      POSTGRES_DB: beekeeper
      POSTGRES_USER: beekeeper
      POSTGRES_PASSWORD: beekeeper
    ports:
      - "5432:5432"
    volumes:
      - ./runtime/docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beekeeper -d beekeeper"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: beekeeper-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./runtime/docker-data/minio:/data

  queen-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beekeeper-queen-api
    command: ["python", "-m", "queen_api.app"]
    ports:
      - "8788:8788"
    environment:
      BEEKEEPER_RUNTIME_ROOT: /app/runtime/phase1
      BEEKEEPER_WORKSPACE_ROOT: /app
      BEEKEEPER_DURABLE_STATE_BACKEND: postgres
      BEEKEEPER_DATABASE_URL: postgresql+psycopg://beekeeper:beekeeper@postgres:5432/beekeeper
      BEEKEEPER_ARTIFACT_BACKEND: minio
      BEEKEEPER_MINIO_ENDPOINT: minio:9000
      BEEKEEPER_MINIO_ACCESS_KEY: minioadmin
      BEEKEEPER_MINIO_SECRET_KEY: minioadmin
      BEEKEEPER_MINIO_BUCKET: beekeeper-artifacts
      BEEKEEPER_MINIO_SECURE: "false"
    volumes:
      - ./runtime/docker-data/phase1:/app/runtime/phase1
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8788/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beekeeper-supervisor
    command: ["python", "-m", "beekeeper.runtime.supervisor_entry", "--watch"]
    environment:
      BEEKEEPER_RUNTIME_ROOT: /app/runtime/phase1
      BEEKEEPER_WORKSPACE_ROOT: /app
      BEEKEEPER_SUPERVISOR_POLL_SECONDS: "1.0"
      BEEKEEPER_DURABLE_STATE_BACKEND: postgres
      BEEKEEPER_DATABASE_URL: postgresql+psycopg://beekeeper:beekeeper@postgres:5432/beekeeper
      BEEKEEPER_ARTIFACT_BACKEND: minio
      BEEKEEPER_MINIO_ENDPOINT: minio:9000
      BEEKEEPER_MINIO_ACCESS_KEY: minioadmin
      BEEKEEPER_MINIO_SECRET_KEY: minioadmin
      BEEKEEPER_MINIO_BUCKET: beekeeper-artifacts
      BEEKEEPER_MINIO_SECURE: "false"
    volumes:
      - ./runtime/docker-data/phase1:/app/runtime/phase1
      - .:/app
    depends_on:
      queen-api:
        condition: service_started
